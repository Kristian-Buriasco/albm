            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/photos/tags:
    post:
      operationId: assignPhotoTags
      summary: Assign a tag to a set of photos
      description: >-
        Requires the `organize` capability on every gallery any of `photoIds` belongs to (owner
        always passes). Provide either an existing `tagId` (must already exist) or a `tagName` to
        find-or-create a tag by name. Max 500 photo ids per call.
      tags:
        - Photos
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - photoIds
              properties:
                photoIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 500
                tagId:
                  type: string
                  description: Id of an existing tag. Mutually exclusive with `tagName`.
                tagName:
                  type: string
                  description: Find-or-create a tag by name. Mutually exclusive with `tagId`.
      responses:
        '200':
          description: Tag assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tagId:
                    type: string
        '400':
          description: >-
            Invalid JSON body, missing/invalid `photoIds`, more than 500 photo ids, unknown `tagId`,
            or neither `tagId` nor `tagName` given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Collaborator lacks `organize` on one of the photos' galleries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: unassignPhotoTags
