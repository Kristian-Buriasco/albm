        always passes).
      tags:
        - Photos
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - photoIds
                - tagId
              properties:
                photoIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                tagId:
                  type: string
      responses:
        '200':
          description: Tag unassigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid JSON body, or missing/invalid `photoIds`/`tagId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Collaborator lacks `organize` on one of the photos' galleries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/sections:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    get:
      operationId: listGallerySections
      summary: List a gallery's sections
      description: Requires the `organize` capability on the gallery (owner always passes).
      tags:
        - Sections
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sections, ordered by `sortOrder`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Section'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Collaborator has no `organize` grant on this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createGallerySection
      summary: Create a section in a gallery
      description: Requires the `organize` capability on the gallery (owner always passes).
      tags:
        - Sections
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  maxLength: 120
                sortOrder:
                  type: integer
                  description: Defaults to one past the current max sort order in the gallery.
      responses:
        '201':
          description: Section created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
        '400':
          description: Invalid JSON body, or missing/blank title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found, or collaborator has no `organize` grant on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchGallerySection
      summary: Rename or reorder a single section
      description: >-
        Requires the `organize` capability on the gallery (owner always passes). Targets the section
        via `sectionId` in the request body (not a path param) — this route serves the whole
        gallery's section collection.
      tags:
        - Sections
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sectionId
              properties:
                sectionId:
                  type: string
                title:
                  type: string
                  maxLength: 120
                sortOrder:
                  type: integer
      responses:
        '200':
          description: Updated section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
        '400':
          description: Invalid JSON body, missing `sectionId`, or nothing to update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Section not found, section belongs to a different gallery, or collaborator has no
            `organize` grant on this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteGallerySection
      summary: Delete a section
      description: >-
        Requires the `organize` capability on the gallery (owner always passes). Targets the section
        via `sectionId` in the request body. Photos in the deleted section become ungrouped
        (`sectionId` set to `null`), not deleted.
      tags:
        - Sections
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sectionId
              properties:
                sectionId:
                  type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid JSON body, or missing `sectionId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Section not found, section belongs to a different gallery, or collaborator has no
            `organize` grant on this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: reorderGallerySections
      summary: Reorder all sections in a gallery
      description: >-
        Requires the `organize` capability on the gallery (owner always passes). Body is an array of
        section ids in the desired order; each section's `sortOrder` is set to its index in the
        array. Non-string entries are silently skipped.
      tags:
        - Sections
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Reordered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid JSON body, or body is not an array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Collaborator has no `organize` grant on this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
