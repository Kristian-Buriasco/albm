openapi: 3.1.0
info:
  title: Albm API
  version: 1.13.0
  description: >
    Self-hosted photography portfolio + client proofing app. This spec covers every route with a
    legitimate standalone use case — see docs/superpowers/specs/2026-07-26-api-docs-design.md in the
    repo for what was deliberately excluded and why (WebAuthn ceremony endpoints, page-load
    plumbing).


    Three separate audiences, three separate auth schemes:

    - **Admin API** (`cookieAuth`) — everything under `/api/admin/*`. Requires
      being logged into the admin panel in this browser; most operations are
      owner-only, a few allow a scoped collaborator.

    - **Client Gallery API** (`visitorCookieAuth`) — everything under
      `/api/g/{slug}/*`. A per-gallery visitor session, established by
      `POST /api/g/{slug}/visitor` or `POST /api/g/{slug}/unlock`.

    - **Publish API** (`bearerAuth`) — `/api/publish/*`. The only part of this
      API meant for real third-party integration (Lightroom Classic plugin,
      Capture One, custom scripts). Tokens are created in
      Admin → Settings → Upload tokens and can upload, replace, **and delete**
      photos — treat one like a password.
  license:
    name: AGPL-3.0-only
    url: https://github.com/Kristian-Buriasco/albm/blob/master/LICENSE
externalDocs:
  description: Albm wiki
  url: https://github.com/Kristian-Buriasco/albm/wiki
servers:
  - url: /
    description: This Albm instance (relative — works from any origin it's deployed at)
tags:
  - name: Galleries
    description: Create, configure, and manage galleries.
  - name: Photos
    description: Upload, tag, and bulk-manage photos within a gallery.
  - name: Sections
    description: Group a gallery's photos into named sections.
  - name: Tags
    description: Shared tag vocabulary used across photos, galleries, and clients.
  - name: Folders
    description: Organize galleries into folders in the admin panel.
  - name: Clients
    description: Cross-gallery client records (name, email, phone, notes, tags).
  - name: Testimonials
    description: Moderated client testimonials shown on the public homepage.
  - name: Inquiries
    description: Leads captured from the public contact form.
  - name: Comments
    description: Moderated comments on client-gallery photos.
  - name: Settings
    description: Site-wide admin settings, including optional SMTP.
  - name: Upload Tokens
    description: Bearer tokens used by the external Publish API.
  - name: Storage & Maintenance
    description: Disk usage and derivative-integrity tooling.
  - name: Audit & Sessions
    description: Admin audit log and active session management.
  - name: Client Gallery
    description: The public, visitor-facing API used by a client browsing their own gallery.
  - name: Publish
    description: External, bearer-token API for Lightroom/Capture One/scripted publishing.
  - name: System
    description: Unauthenticated health and version endpoints.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: admin_session
      description: >
        Admin panel login session (password or passkey). Owner-only unless an operation's
        description says a scoped collaborator may also call it.
    visitorCookieAuth:
      type: apiKey
      in: cookie
      name: visitor_{galleryId}
      description: >
        Per-gallery visitor session. Cookie name is scoped to the specific gallery (OpenAPI can't
        parametrize a cookie name per path, so this is documented rather than modeled literally) —
        established by `POST /api/g/{slug}/visitor` or, for password/PIN-gated galleries, `POST
        /api/g/{slug}/unlock`.
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Upload token from Admin → Settings → Upload tokens, shown once at creation. Can upload,
        replace, and delete photos in any gallery — treat it like a password.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Gallery:
      type: object
      description: A gallery row, as stored (includes hashed secrets — never plaintext).
      properties:
        id:
          type: string
        slug:
          type: string
        type:
          type: string
          enum:
            - client
            - portfolio
        title:
          type: string
        eventDate:
          type:
            - integer
            - 'null'
          description: Unix ms timestamp.
        passwordHash:
          type:
            - string
            - 'null'
        clientInfoMode:
          type: string
          enum:
            - 'off'
            - optional
            - required
        watermarkEnabled:
          type: boolean
        watermarkPosition:
          type: string
          enum:
            - br
            - bl
            - tr
            - tl
            - center
        watermarkOpacity:
          type: integer
          minimum: 0
          maximum: 100
        watermarkScale:
          type: integer
          minimum: 5
          maximum: 100
        downloadEnabled:
          type: boolean
        favoritesDownloadEnabled:
          type: boolean
        selectionExportEnabled:
          type: boolean
        published:
          type: boolean
        featured:
          type: boolean
        showLikeCounts:
          type: boolean
        showExif:
          type: boolean
        showLocation:
          type: boolean
        locationName:
          type:
            - string
            - 'null'
        locationLat:
          type:
            - string
            - 'null'
        locationLng:
          type:
            - string
            - 'null'
        commentsMode:
          type: string
          enum:
            - 'off'
            - post
            - pre
        expiresAt:
          type:
            - integer
            - 'null'
          description: Unix ms timestamp.
        autoExpire:
          type: boolean
        selectionLimit:
          type:
            - integer
            - 'null'
        limitSelections:
          type: boolean
        trackDownloads:
          type: boolean
        socialPreview:
          type: boolean
        coverPhotoId:
          type:
            - string
            - 'null'
        previewPhotoId:
          type:
            - string
            - 'null'
        coverFocusX:
          type: integer
          minimum: 0
          maximum: 100
        coverFocusY:
          type: integer
          minimum: 0
          maximum: 100
        pinEnabled:
          type: boolean
        pinHash:
          type:
            - string
            - 'null'
        folderId:
          type:
            - string
            - 'null'
        sortOrder:
          type: integer
        autoPublishOnUpload:
          type: boolean
        deliverRaw:
          type: boolean
        forensicWatermark:
          type: boolean
        downloadOfferWeb:
          type: boolean
        downloadOfferPrint:
          type: boolean
        downloadOfferOriginal:
          type: boolean
        keepExifOnDownload:
          type: boolean
        allowGpsInDownload:
          type: boolean
        bibSearch:
          type: boolean
          description: OCR bib-number detection at upload.
        faceSearch:
          type: boolean
          description: Face embedding batch + selfie search.
        eventPage:
          type: boolean
          description: Public event landing page + venue QR.
        faceBatchStatus:
          type: string
          enum:
            - idle
            - running
            - done
            - error
        faceBatchDone:
          type: integer
        faceBatchTotal:
          type: integer
        faceBatchError:
          type:
            - string
            - 'null'
        faceBatchUpdatedAt:
          type:
            - integer
            - 'null'
        deliveryState:
          type: string
          enum:
            - proofing
            - retouching
            - delivered
        storageQuotaBytes:
          type:
            - integer
            - 'null'
          description: Soft quota in bytes; null = unlimited. Alerts only, never blocks upload.
        kioskEnabled:
          type: boolean
        kioskToken:
          type:
            - string
            - 'null'
        metaTitle:
          type:
            - string
            - 'null'
        metaDescription:
          type:
            - string
            - 'null'
        noindex:
          type: boolean
        featuredConsent:
          type: string
          enum:
            - none
            - requested
            - granted
            - declined
        clientId:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
        updatedAt:
          type: integer
    GalleryPatchRequest:
      type: object
      description: >-
        All fields optional; only keys present in the request body are updated. `password` and `pin`
        are write-only (never returned by any response) and are hashed server-side.
      properties:
        title:
          type: string
        slug:
          type: string
          description: >-
            Custom URL slug. Normalized server-side (lowercased, non-alphanumerics
            collapsed to hyphens). 400 if the normalized result is empty, 409 if it
            collides with another gallery's current slug. The old slug keeps working
            as a redirect to the new one (307 for client galleries, 308 for portfolio).
        type:
          type: string
          enum:
            - client
            - portfolio
        eventDate:
          type:
            - integer
            - 'null'
        clientInfoMode:
          type: string
          enum:
            - 'off'
            - optional
            - required
        commentsMode:
          type: string
          enum:
            - 'off'
            - post
            - pre
        watermarkPosition:
          type: string
          enum:
            - br
            - bl
            - tr
            - tl
            - center
        watermarkEnabled:
          type: boolean
        watermarkOpacity:
          type: integer
          minimum: 0
          maximum: 100
        watermarkScale:
          type: integer
          minimum: 5
          maximum: 100
        downloadEnabled:
          type: boolean
        favoritesDownloadEnabled:
          type: boolean
        selectionExportEnabled:
          type: boolean
        published:
          type: boolean
        featured:
          type: boolean
          description: >-
            Turning this on for a `client`-type gallery without existing `featured: granted` consent
            sets `featuredConsent` to `requested` rather than publishing to the homepage
            immediately.
        showLikeCounts:
          type: boolean
        showExif:
          type: boolean
        showLocation:
          type: boolean
        locationName:
          type:
            - string
            - 'null'
          maxLength: 200
        locationLat:
          type:
            - string
            - 'null'
          maxLength: 32
        locationLng:
          type:
            - string
            - 'null'
          maxLength: 32
        expiresAt:
          type:
            - integer
            - 'null'
        autoExpire:
          type: boolean
        selectionLimit:
          type:
            - integer
            - 'null'
          minimum: 1
        limitSelections:
          type: boolean
        trackDownloads:
          type: boolean
        socialPreview:
          type: boolean
        coverPhotoId:
          type:
            - string
            - 'null'
        previewPhotoId:
          type:
            - string
            - 'null'
        sortOrder:
          type: integer
        coverFocusX:
          type: integer
          minimum: 0
          maximum: 100
        coverFocusY:
          type: integer
          minimum: 0
          maximum: 100
        pinEnabled:
          type: boolean
        folderId:
          type:
            - string
            - 'null'
        autoPublishOnUpload:
          type: boolean
        deliverRaw:
          type: boolean
        forensicWatermark:
          type: boolean
        downloadOfferWeb:
          type: boolean
        downloadOfferPrint:
          type: boolean
        downloadOfferOriginal:
          type: boolean
        keepExifOnDownload:
          type: boolean
        allowGpsInDownload:
          type: boolean
        bibSearch:
          type: boolean
        faceSearch:
          type: boolean
        eventPage:
          type: boolean
        metaTitle:
          type:
            - string
            - 'null'
          maxLength: 200
        metaDescription:
          type:
            - string
            - 'null'
          maxLength: 500
        noindex:
          type: boolean
        clientId:
          type:
            - string
            - 'null'
        storageQuotaBytes:
          type:
            - integer
            - 'null'
          minimum: 1
        password:
          type:
            - string
            - 'null'
          description: Write-only. Empty string or null clears the password.
        pin:
          type:
            - string
            - 'null'
          pattern: ^\d{6}$
          description: >-
            Write-only. Must be exactly 6 digits when non-empty. Empty string or null clears the
            PIN.
    GalleryCreateRequest:
      allOf:
        - $ref: '#/components/schemas/GalleryPatchRequest'
        - type: object
          required:
            - title
          properties:
            title:
              type: string
              description: Required at creation (unlike PATCH, where it's optional).
            slug:
              type: string
              description: >-
                Optional at creation, unlike PATCH: invalid, blank, or colliding input
                silently falls back to a random slug rather than failing the request.
    Photo:
      type: object
      properties:
        id:
          type: string
        galleryId:
          type: string
        sectionId:
          type:
            - string
            - 'null'
        filename:
          type: string
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
        sortOrder:
          type: integer
        status:
          type: string
          enum:
            - processing
            - ready
            - error
        exif:
          type:
            - string
            - 'null'
          description: JSON-encoded EXIF data.
        capturedAt:
          type:
            - integer
            - 'null'
          description: Unix ms timestamp.
        placeholder:
          type:
            - string
            - 'null'
          description: Blur-up placeholder data.
        altText:
          type:
            - string
            - 'null'
        contentHash:
          type:
            - string
            - 'null'
        isRaw:
          type: boolean
        format:
          type:
            - string
            - 'null'
        uploadedBy:
          type:
            - string
            - 'null'
          description: Collaborator id if uploaded by a collaborator; null means the owner.
        createdAt:
          type: integer
        updatedAt:
          type: integer
    Section:
      type: object
      properties:
        id:
          type: string
        galleryId:
          type: string
        title:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: integer
    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Folder:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: integer
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          description: Unix epoch milliseconds.
        updatedAt:
          type: integer
          description: Unix epoch milliseconds.
      required:
        - id
        - name
        - email
        - phone
        - notes
        - createdAt
        - updatedAt
    ClientGallerySummary:
      type: object
      description: Reduced gallery projection returned alongside a client's detail view.
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum:
            - client
            - portfolio
        deliveryState:
          type: string
          enum:
            - proofing
            - retouching
            - delivered
      required:
        - id
        - title
        - type
        - deliveryState
    Testimonial:
      type: object
      properties:
        id:
          type: string
        galleryId:
          type: string
        visitorId:
          type:
            - string
            - 'null'
        rating:
          type: integer
        quote:
          type: string
        authorName:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - hidden
        createdAt:
          type: integer
          description: Unix epoch milliseconds.
        approvedAt:
          type:
            - integer
            - 'null'
          description: Unix epoch milliseconds, set when approved.
      required:
        - id
        - galleryId
        - visitorId
        - rating
        - quote
        - authorName
        - status
        - createdAt
        - approvedAt
    Comment:
      type: object
      properties:
        id:
          type: string
        galleryId:
          type: string
        photoId:
          type: string
        visitorId:
          type:
            - string
            - 'null'
        commenterToken:
          type:
            - string
            - 'null'
        authorName:
          type: string
        body:
          type: string
        isPhotographer:
          type: boolean
        status:
          type: string
          enum:
            - visible
            - pending
            - hidden
        createdAt:
          type: integer
          description: Unix epoch milliseconds.
      required:
        - id
        - galleryId
        - photoId
        - visitorId
        - commenterToken
        - authorName
        - body
        - isPhotographer
        - status
        - createdAt
    SelectionList:
      type: object
      description: A visitor-owned named selection list (max 5 per visitor per gallery).
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
      required:
        - id
        - name
    GalleryPhoto:
      type: object
      description: A ready photo as rendered in the gallery lightbox/grid.
      properties:
        id:
          type: string
        filename:
          type: string
        width:
          type: integer
        height:
          type: integer
        placeholder:
          type:
            - string
            - 'null'
          description: Low-res blur-up placeholder (e.g. base64 data URI or blurhash), if generated.
        updatedAt:
          type: integer
          description: Unix ms timestamp.
        alt:
          type: string
        exifLine:
          type:
            - string
            - 'null'
          description: >-
            Formatted EXIF summary, only present when the gallery has `showExif` enabled and the
            photo has EXIF data.
      required:
        - id
        - filename
        - width
        - height
        - updatedAt
        - alt
    SiteSettings:
      type: object
      description: Full settings payload returned by `GET /api/admin/settings`.
      properties:
        aboutContent:
          type: string
        contactContent:
          type: string
        analyticsHeadHtml:
          type: string
        homeEyebrow:
          type: string
        homeHeadline:
          type: string
        homeIntro:
          type: string
        contactEmail:
          type: string
        contactInstagram:
          type: string
        contactWhatsapp:
          type: string
        footerContent:
          type: string
        defaultLanguage:
          type: string
          enum:
            - en
            - nl
            - it
        contactResponseTime:
          type: string
        smtpHost:
          type: string
        smtpPort:
          type: string
        smtpUser:
          type: string
        smtpFrom:
          type: string
        smtpTo:
          type: string
        smtpPassSet:
          type: boolean
          description: Whether an SMTP password is stored. The password itself is never returned.
        galleryDefaults:
          type: object
          description: Default values applied to newly created galleries (site-specific shape).
          additionalProperties: true
        hasWatermark:
          type: boolean
    SiteSettingsUpdate:
      type: object
      description: >-
        Partial update to site settings. Every field is optional; only recognized string/boolean
        fields of the expected type are applied, everything else is silently ignored. Text fields
        are trimmed and length-capped server-side (200 chars for short fields, 2000 for long-form
        content).
      properties:
        aboutContent:
          type: string
        contactContent:
          type: string
        analyticsHeadHtml:
          type: string
        homeEyebrow:
          type: string
        homeHeadline:
          type: string
        homeIntro:
          type: string
        contactEmail:
          type: string
        contactInstagram:
          type: string
        contactWhatsapp:
          type: string
        footerContent:
          type: string
        defaultLanguage:
          type: string
          description: Any value other than `nl`/`it` falls back to `en`.
          enum:
            - en
            - nl
            - it
        contactResponseTime:
          type: string
        smtpHost:
          type: string
        smtpPort:
          type: string
          description: Non-digit characters are stripped; capped at 5 digits.
        smtpUser:
          type: string
        smtpFrom:
          type: string
        smtpTo:
          type: string
        smtpPass:
          type: string
          description: New SMTP password. Ignored if empty string; use `smtpPassClear` to clear.
        smtpPassClear:
          type: boolean
          description: If `true`, clears the stored SMTP password (takes precedence over `smtpPass`).
        galleryDefaults:
          type: object
          description: Replaces the stored gallery-defaults object.
          additionalProperties: true
    SecuritySettings:
      type: object
      properties:
        passkeys:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              createdAt:
                type: integer
              lastUsedAt:
                type:
                  - integer
                  - 'null'
        passwordLoginEnabled:
          type: boolean
        unusedRecoveryCodes:
          type: integer
        canDisablePasswordLogin:
          type: boolean
        disablePasswordReason:
          type:
            - string
            - 'null'
    UploadToken:
      type: object
      description: >-
        Upload token metadata (raw token value only ever appears in the create response). Backed by
        the `upload_tokens` table.
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: integer
          description: Epoch milliseconds.
        lastUsedAt:
          type:
            - integer
            - 'null'
          description: Epoch milliseconds, null if never used.
        revokedAt:
          type:
            - integer
            - 'null'
          description: Epoch milliseconds, null if not revoked.
    StorageSnapshot:
      type: object
      properties:
        computedAt:
          type: integer
          description: Epoch milliseconds this snapshot was computed (cached for 1 hour).
        disk:
          $ref: '#/components/schemas/DiskUsage'
        dataDirBytes:
          type: integer
        galleries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              type:
                type: string
              photoCount:
                type: integer
              sizeBytes:
                type: integer
              rawCount:
                type: integer
              rawBytes:
                type: integer
    DiskUsage:
      type: object
      properties:
        totalBytes:
          type: integer
        freeBytes:
          type: integer
        usedBytes:
          type: integer
    IntegritySummary:
      type: object
      properties:
        galleries:
          type: array
          items:
            type: object
            properties:
              galleryId:
                type: string
              title:
                type: string
              total:
                type: integer
              missingCount:
                type: integer
              missing:
                type: array
                items:
                  type: object
                  properties:
                    photoId:
                      type: string
                    filename:
                      type: string
                    missingKinds:
                      type: array
                      items:
                        type: string
                        enum:
                          - thumb
                          - md
                          - web
                          - workingJpeg
                          - print
        totalPhotos:
          type: integer
        totalMissing:
          type: integer
    AllGalleriesStorageUsage:
      type: object
      properties:
        galleries:
          type: array
          items:
            type: object
            properties:
              galleryId:
                type: string
              title:
                type: string
              usedBytes:
                type: integer
              quotaBytes:
                type:
                  - integer
                  - 'null'
              pct:
                type:
                  - number
                  - 'null'
              state:
                type: string
                enum:
                  - ok
                  - warn
                  - over
        volume:
          $ref: '#/components/schemas/DiskUsage'
    RegenerateResult:
      type: object
      properties:
        photoId:
          type: string
        ok:
          type: boolean
        regenerated:
          type: array
          items:
            type: string
            enum:
              - thumb
              - md
              - web
              - workingJpeg
              - print
        failed:
          type: array
          items:
            type: string
            enum:
              - thumb
              - md
              - web
              - workingJpeg
              - print
    RegenerateGalleryResult:
      type: object
      properties:
        galleryId:
          type: string
        attempted:
          type: integer
          description: Number of photos that had at least one missing derivative.
        results:
          type: array
          items:
            $ref: '#/components/schemas/RegenerateResult'
    AuditLogEntry:
      type: object
      description: One row from the audit log (shape follows the `audit_log` table).
      properties:
        id:
          type: string
        at:
          type: integer
          description: Epoch milliseconds.
        action:
          type: string
          description: Action type, e.g. "settings.update", "upload_token.create".
        actorType:
          type: string
          enum:
            - owner
            - collaborator
        actorId:
          type:
            - string
            - 'null'
        targetType:
          type:
            - string
            - 'null'
        targetId:
          type:
            - string
            - 'null'
        summary:
          type:
            - string
            - 'null'
    AdminSession:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: integer
        lastSeenAt:
          type: integer
        userAgentHash:
          type:
            - string
            - 'null'
        ipHash:
          type:
            - string
            - 'null'
        device:
          type:
            - string
            - 'null'
        location:
          type:
            - string
            - 'null'
        collaboratorId:
          type:
            - string
            - 'null'
        isCurrent:
          type: boolean
    PublishGallery:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        type:
          type: string
          description: e.g. "portfolio".
    PublishPhoto:
      type: object
      description: The created/replaced photo row, returned on successful upload (`201`) or replace (`200`).
      properties:
        id:
          type: string
        galleryId:
          type: string
        sectionId:
          type:
            - string
            - 'null'
        filename:
          type: string
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
        sortOrder:
          type: integer
        status:
          type: string
          enum:
            - processing
            - ready
            - error
        capturedAt:
          type:
            - integer
            - 'null'
    PublishDuplicate:
      type: object
      properties:
        duplicate:
          type: boolean
          const: true
        existingFilename:
          type: string
    VersionInfo:
      type: object
      properties:
        current:
          type: string
          description: Running app version.
        latest:
          type:
            - string
            - 'null'
          description: Latest GitHub release tag, or null if unknown/update-check disabled.
        updateAvailable:
          type: boolean
  parameters:
    GallerySlug:
      name: slug
      in: path
      required: true
      description: The client gallery's public slug.
      schema:
        type: string
paths:
  /api/admin/galleries:
    post:
      operationId: createGallery
      summary: Create a gallery
      description: >-
        Creates a new client or portfolio gallery. Owner-only. Accepts the same settable fields as
        `PATCH /api/admin/galleries/{id}` at creation time (plus `title`, which is required here).
        If `password` is provided, it is hashed before storage.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GalleryCreateRequest'
      responses:
        '201':
          description: Gallery created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '400':
          description: Missing/invalid body, or missing title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    get:
      operationId: getGallery
      summary: Get a gallery
      description: Returns the full gallery row. Owner-only.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchGallery
      summary: Update a gallery's settings
      description: >-
        Partial update of gallery fields. Owner-only. Setting `password` to a non-empty string
        hashes and stores it; an empty string or omission-with-key clears it. Setting `pin` requires
        a 6-digit string (`400` otherwise), `null` or `""` clears it. Turning `featured` on for a
        `client` gallery that hasn't granted consent sets `featuredConsent` to `requested` instead
        of publishing it to the homepage immediately. Changing watermark-affecting fields
        (`watermarkEnabled`, `watermarkPosition`, `watermarkOpacity`, `watermarkScale`) queues
        reprocessing for every photo in the gallery. Every change of note is written to the audit
        log.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GalleryPatchRequest'
      responses:
        '200':
          description: Updated gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '400':
          description: Invalid JSON body, PIN not 6 digits, or `slug` normalized to empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Requested `slug` is already taken by another gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteGallery
      summary: Delete a gallery
      description: >-
        Deletes the gallery row and removes all of its files from disk (`recursive`/`force` rmdir).
        Owner-only. Irreversible.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/cleanup:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    post:
      operationId: cleanupGalleryExpired
      summary: Run a cleanup action on an expired client gallery
      description: >-
        Owner-only. Only usable on `client`-type galleries that are actually expired (`400`
        otherwise). `action: "unpublish"` unpublishes the gallery. `action: "delete-photos"` removes
        every photo's files from disk (original, web, thumb) but keeps the DB rows. `action:
        "delete"` deletes the gallery entirely, DB row and files.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - unpublish
                    - delete-photos
                    - delete
      responses:
        '200':
          description: Cleanup action applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  action:
                    type: string
                    enum:
                      - unpublish
                      - delete-photos
                      - delete
                  removed:
                    type: integer
                    description: Present only for `delete-photos` — number of photos whose files were removed.
        '400':
          description: Invalid JSON body, gallery is not an expired client gallery, or unknown `action`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/reprocess:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    post:
      operationId: reprocessGalleryPhotos
      summary: Queue reprocessing for every photo in a gallery
      description: >-
        Owner-only. Re-queues derivative generation (thumbnails/web sizes/watermarking) for every
        photo currently in the gallery, e.g. after changing watermark settings out of band.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Reprocessing queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                    description: Number of photos queued for reprocessing.
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/delivery:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    patch:
      operationId: patchGalleryDeliveryState
      summary: Advance a gallery's delivery-lifecycle state
      description: >-
        Owner-only. Sets `deliveryState` to one of `proofing`, `retouching`, `delivered` and records
        the transition as a `gallery_events` row. No-op (`changed: false`) if the requested state
        matches the current one.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
              properties:
                state:
                  type: string
                  enum:
                    - proofing
                    - retouching
                    - delivered
      responses:
        '200':
          description: State change applied (or was already at that state).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  changed:
                    type: boolean
        '400':
          description: Invalid JSON body, or `state` is not a valid delivery state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: addGalleryDeliveryNote
      summary: Append a free-text note to a gallery's delivery timeline
      description: Owner-only. Adds a `note`-type `gallery_events` row.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Note added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid JSON body, or `note` is blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/kiosk:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    patch:
      operationId: patchGalleryKiosk
      summary: Enable or disable kiosk (live event wall) mode
      description: >-
        Owner-only. Enabling generates a stable `kioskToken` if one doesn't already exist (used for
        the public kiosk deep link); disabling only flips the flag and leaves any existing token in
        place so re-enabling doesn't rotate it.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Kiosk mode updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  kioskEnabled:
                    type: boolean
                  kioskToken:
                    type:
                      - string
                      - 'null'
        '400':
          description: Invalid JSON body, or `enabled` is not a boolean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/watermark:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    get:
      operationId: getGalleryWatermark
      summary: Download a gallery's custom watermark image
      description: >-
        Owner-only. Returns the raw PNG file if one has been uploaded for this gallery, otherwise a
        bodyless `404`.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The watermark PNG.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No watermark uploaded for this gallery.
    post:
      operationId: uploadGalleryWatermark
      summary: Upload a gallery's custom watermark image
      description: >-
        Owner-only. Multipart upload; the `file` field must be a PNG (checked by magic-byte
        sniffing, not just content-type). If `watermarkEnabled` is already on for this gallery,
        uploading queues reprocessing for every photo.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG image file.
      responses:
        '200':
          description: Watermark stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Missing `file` field, or gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Uploaded file is not a valid PNG.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteGalleryWatermark
      summary: Remove a gallery's custom watermark image
      description: >-
        Owner-only. Deletes the watermark file if present. If `watermarkEnabled` is on for this
        gallery, queues reprocessing for every photo.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Watermark removed (or was already absent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/storage:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    get:
      operationId: getGalleryStorage
      summary: Get a gallery's disk storage usage
      description: Owner-only. Returns computed storage-usage figures for the gallery.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Storage usage.
          content:
            application/json:
              schema:
                type: object
                description: Shape returned by the storage-usage calculator (bytes used, quota, etc).
                additionalProperties: true
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/selections.csv:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    get:
      operationId: exportGallerySelectionsCsv
      summary: Export a gallery's visitor selections as CSV
      description: >-
        Owner-only. Returns a `text/csv` attachment with columns `filename, visitor_name,
        visitor_email, list_name, selected_at`, one row per (photo, visitor, list) selection.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: CSV export.
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/face-batch:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    get:
      operationId: getGalleryFaceBatch
      summary: Get face-search embedding batch progress
      description: >-
        Owner-only. Returns the gallery's `faceSearch` flag, the batch's status/progress fields, and
        the current stored face count.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Face-batch status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  faceSearch:
                    type: boolean
                  status:
                    type: string
                    enum:
                      - idle
                      - running
                      - done
                      - error
                  done:
                    type: integer
                  total:
                    type: integer
                  error:
                    type:
                      - string
                      - 'null'
                  updatedAt:
                    type:
                      - integer
                      - 'null'
                    description: Unix ms timestamp.
                  faceCount:
                    type: integer
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: startGalleryFaceBatch
      summary: Start the face-embedding batch for a gallery
      description: >-
        Owner-only. Kicks off an overnight-style embedding batch over the gallery's photos (not
        real-time). Fails with `400` if a batch can't be started (e.g. already running, or face
        search not enabled) per `startFaceBatch`'s own validation.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Batch started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Batch could not be started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: purgeGalleryFaces
      summary: Purge all face embeddings for a gallery
      description: >-
        Owner-only. GDPR-style deletion of every stored face embedding for the gallery's photos.
        Logged to the audit log.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Purge complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: integer
                    description: Number of face embeddings deleted.
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/collaborators:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    get:
      operationId: listGalleryCollaborators
      summary: List a gallery's collaborators
      description: Owner-only. Lists everyone with a `collaborator`-kind grant on this gallery.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Collaborators.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaborators:
                    type: array
                    items:
                      type: object
                      properties:
                        grantId:
                          type: string
                        collaboratorId:
                          type: string
                        email:
                          type: string
                        name:
                          type:
                            - string
                            - 'null'
                        capabilities:
                          type: string
                          description: JSON-encoded array of capability strings, e.g. `["upload","organize"]`.
                        lastLoginAt:
                          type:
                            - integer
                            - 'null'
                        disabledAt:
                          type:
                            - integer
                            - 'null'
                        createdAt:
                          type: integer
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: inviteGalleryCollaborator
      summary: Invite a collaborator to a gallery
      description: >-
        Owner-only. Creates a pending collaborator grant and a single-use onboarding link (WebAuthn
        registration happens client-side at that link; not part of this API). Logged to the audit
        log.
      tags:
        - Galleries
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                name:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Invite created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaboratorId:
                    type: string
                  onboardingUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: integer
                    description: Unix ms timestamp the invite expires.
        '400':
          description: Invalid JSON body, or missing/invalid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/photos:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    get:
      operationId: listGalleryPhotos
      summary: List a gallery's photos
      description: >-
        Requires the `upload` or `organize` capability on the gallery (owner always passes; a
        collaborator with neither capability gets a `404`, not a `401`, to avoid leaking gallery
        existence). Pass `?tags=1` to also receive a `photoId -> tags` map alongside the photo list.
      tags:
        - Photos
      security:
        - cookieAuth: []
      parameters:
        - name: tags
          in: query
          required: false
          schema:
            type: string
            enum:
              - '1'
          description: When `1`, response includes a `photoTags` map.
      responses:
        '200':
          description: Photos (array), or `{ photos, photoTags }` when `tags=1`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Photo'
                  - type: object
                    properties:
                      photos:
                        type: array
                        items:
                          $ref: '#/components/schemas/Photo'
                      photoTags:
                        type: object
                        description: Map of photoId to an array of `{ id, name }` tags.
                        additionalProperties:
                          type: array
                          items:
                            $ref: '#/components/schemas/Tag'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Collaborator has no grant on this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: uploadGalleryPhoto
      summary: Upload a photo to a gallery
      description: >-
        Requires the `upload` capability on the gallery (owner always passes). Multipart upload;
        `file` is required, `sectionId` is optional. If the uploaded file's content hash already
        exists in the gallery, returns `200` with `{ duplicate: true, existingFilename }` instead of
        creating a new photo. When uploaded by a collaborator, the photo's `uploadedBy` is set to
        their collaborator id.
      tags:
        - Photos
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                sectionId:
                  type: string
                  description: Optional section to place the photo in.
      responses:
        '200':
          description: Duplicate detected — no new photo created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate:
                    type: boolean
                    enum:
                      - true
                  existingFilename:
                    type: string
        '201':
          description: Photo created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '400':
          description: Not multipart form data, or missing `file`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found, or collaborator has no `upload` grant on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported/unreadable image format (only JPEG and PNG are accepted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Upload failed for an unexpected reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/photos/bulk:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Gallery id.
    post:
      operationId: bulkUpdateGalleryPhotos
      summary: Run a bulk action over a set of photos in a gallery
      description: >-
        `action: "delete"` and `action: "cover"` are owner-only (destructive / gallery-settings
        changes). `action: "move"` only requires the `organize` capability on the gallery. All
        `photoIds` must belong to this gallery.
      tags:
        - Photos
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - photoIds
                - action
              properties:
                photoIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                action:
                  type: string
                  enum:
                    - delete
                    - move
                    - cover
                sectionId:
                  type:
                    - string
                    - 'null'
                  description: Required when `action` is `move`; `null` moves photos to ungrouped.
      responses:
        '200':
          description: Action applied.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Result of `action: "delete"`.'
                    properties:
                      ok:
                        type: boolean
                      deleted:
                        type: integer
                  - type: object
                    description: 'Result of `action: "move"`.'
                    properties:
                      ok:
                        type: boolean
                      moved:
                        type: integer
                  - type: object
                    description: 'Result of `action: "cover"`.'
                    properties:
                      ok:
                        type: boolean
                      coverPhotoId:
                        type: string
        '400':
          description: >-
            Invalid JSON body, empty/missing `photoIds`, invalid photo id, missing `sectionId` for a
            `move`, more/less than one photo id for `cover`, or unknown `action`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated as owner (for `delete`/`cover`), or not authenticated at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            For `move`, target section not found or not in this gallery; or collaborator has no
            `organize` grant on this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/photos/{id}:
    parameters:
      - name: id
