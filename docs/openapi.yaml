  /api/admin/clients:
    get:
      tags:
        - Clients
      summary: List clients
      description: Returns every client, sorted by name. Owner-only.
      operationId: listClients
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Clients
      summary: Create a client
      description: >-
        Creates a client record. `name` and `email` are required (both trimmed; empty after trimming
        is rejected); `phone` and `notes` are optional. Owner-only.
      operationId: createClient
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  description: Trimmed and truncated to 200 characters server-side.
                email:
                  type: string
                  description: Trimmed and truncated to 320 characters server-side.
                phone:
                  type:
                    - string
                    - 'null'
                  description: Trimmed and truncated to 40 characters server-side.
                notes:
                  type:
                    - string
                    - 'null'
                  description: Trimmed and truncated to 5000 characters server-side.
      responses:
        '201':
          description: Client created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Missing/blank name or email, or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/clients/{id}:
    get:
      tags:
        - Clients
      summary: Get a client
      description: >-
        Returns a single client along with a summary of the galleries assigned to them (id, title,
        type, delivery state). Owner-only.
      operationId: getClient
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Client and its galleries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: '#/components/schemas/Client'
                  galleries:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientGallerySummary'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Clients
      summary: Update a client
      description: >-
        Partially updates a client. Only fields present in the body are changed; `name`/`email` are
        rejected if they'd end up blank after trimming. Owner-only.
      operationId: updateClient
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type:
                    - string
                    - 'null'
                notes:
                  type:
                    - string
                    - 'null'
      responses:
        '200':
          description: Updated client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Invalid JSON body, or name/email would be blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Clients
      summary: Delete a client
      description: Deletes a client. Owner-only.
      operationId: deleteClient
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/clients/{id}/tags:
    post:
      tags:
        - Clients
      summary: Assign a tag to a client
      description: >-
        Assigns an existing tag (by `tagId`) or creates a new tag from `tagName` and assigns it.
        Exactly one of the two must be provided. Owner-only.
      operationId: assignClientTag
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tagId:
                  type: string
                  description: ID of an existing tag. Must exist if provided.
                tagName:
                  type: string
                  description: Name of a new tag to create when tagId is not given.
      responses:
        '200':
          description: Tag assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  tagId:
                    type: string
        '400':
          description: Invalid JSON body, unknown tagId, or neither tagId nor tagName provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Clients
      summary: Unassign a tag from a client
      description: Removes a tag assignment from a client. Owner-only.
      operationId: unassignClientTag
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tagId
              properties:
                tagId:
                  type: string
      responses:
        '200':
          description: Tag unassigned (also returned if the client didn't have that tag).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
        '400':
          description: Invalid JSON body, or missing tagId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/testimonials:
    get:
      tags:
        - Testimonials
      summary: List testimonials
      description: >-
        Returns testimonials, optionally filtered by status. An invalid or omitted `status` query
        param returns all statuses. Owner-only.
      operationId: listTestimonials
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - approved
              - hidden
          description: Filter by status; any other value is ignored (returns all).
      responses:
        '200':
          description: List of testimonials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  testimonials:
                    type: array
                    items:
                      $ref: '#/components/schemas/Testimonial'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/testimonials/{id}:
    patch:
      tags:
        - Testimonials
      summary: Approve or hide a testimonial
      description: >-
        Sets a testimonial's status to `approved` or `hidden`. No other status values are accepted
        via this endpoint. Owner-only.
      operationId: updateTestimonialStatus
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - approved
                    - hidden
      responses:
        '200':
          description: Updated testimonial.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  testimonial:
                    $ref: '#/components/schemas/Testimonial'
        '400':
          description: Invalid JSON body, or status is not approved/hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Testimonial not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/inquiries/{id}:
    patch:
      tags:
        - Inquiries
      summary: Set an inquiry's status
      description: >-
        Updates the triage status of a contact-form inquiry to `new`, `read`, or `archived`.
        Owner-only. Inquiries have no standalone list API route (listed server-side in the admin
        panel), so only this status-update endpoint is documented here.
      operationId: updateInquiryStatus
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - new
                    - read
                    - archived
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
        '400':
          description: Invalid JSON body, or status not one of new/read/archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/comments:
    get:
      tags:
        - Comments
      summary: List or count pending comments
      description: >-
        With `status=pending` (the default), returns every pending comment across all galleries plus
        a count. With any other `status` value, returns only the pending count (comments array
        omitted). Owner-only.
      operationId: listAdminComments
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: pending
          description: >-
            "pending" (default) returns full pending comments + count; any other value returns just
            the pending count.
      responses:
        '200':
          description: Pending comments and/or count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/comments/{id}:
    patch:
      tags:
        - Comments
      summary: Show or hide a comment
      description: >-
        Sets a comment's status to `visible` or `hidden`. No other status values are accepted via
        this endpoint. Owner-only.
      operationId: updateCommentStatus
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - visible
                    - hidden
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
        '400':
          description: Invalid JSON body, or status not visible/hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Comment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Comments
      summary: Hide a comment
      description: >-
        Soft-deletes a comment by setting its status to `hidden`. This is a moderation hide, not a
        row deletion; succeeds even if the comment ID does not exist. Owner-only.
      operationId: deleteComment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment hidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/galleries/{id}/comments:
    get:
      tags:
        - Comments
      summary: List comments for a gallery
      description: >-
        Returns comments on a gallery. With `status=all` (the default), returns every non-hidden
        comment; with an explicit status (`visible`, `pending`, or `hidden`), returns only comments
        matching it exactly. Owner-only.
      operationId: listGalleryComments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Gallery ID.
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: all
          description: '"all" (default) returns non-hidden comments; otherwise filters to an exact status match.'
      responses:
        '200':
          description: Comments for the gallery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Comments
      summary: Post a photographer comment on a photo
      description: >-
        Creates a comment authored by the photographer (`isPhotographer: true`, status `visible`) on
        a photo within the gallery. `photoId` must reference a photo that belongs to this gallery.
        Owner-only.
      operationId: createGalleryComment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Gallery ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - photoId
                - body
              properties:
                photoId:
                  type: string
                body:
                  type: string
                  description: Trimmed; max 2000 characters.
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid JSON body, missing photoId/body, or body longer than 2000 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Photo not found in this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/unlock:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    get:
      tags:
        - Client Gallery
      operationId: getGalleryAccessMode
      summary: Get a gallery's access mode
      description: >-
        Returns whether the client gallery is unlocked with a PIN, a password, or has no gate at
        all. Rate-limited to 60 requests/minute per IP via `writeAllowed`. Only published,
        `client`-type galleries are visible; anything else (or a missing gallery) reports as not
        found.
      security:
        - visitorCookieAuth: []
      responses:
        '200':
          description: Access mode resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                      - pin
                      - password
                      - none
                required:
                  - mode
        '404':
          description: Gallery not found, unpublished, or not a client gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Client Gallery
      operationId: unlockGallery
      summary: Unlock a gallery with its password or PIN
      description: >-
        This route is one of the ones that actually establishes gallery access: on success it adds
        the gallery to the caller's gallery-access session (a signed cookie), which subsequent
        `visitorCookieAuth`-gated routes check via `canViewGallery`. Whether a PIN or password is
        expected depends on the gallery's configuration (`galleryUsesPin`). Failed attempts are
        tracked per scope/IP via `isRateLimited`/`recordFailure` (PIN attempts use a stricter,
        gallery-scoped limiter than password attempts); a correct attempt clears the failure
        counter. If the gallery has no password/PIN hash configured for its mode, the route reports
        success without checking anything.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Required when the gallery uses password mode.
                pin:
                  type: string
                  description: Required when the gallery uses PIN mode.
      responses:
        '200':
          description: Unlocked (or gallery has no gate configured for its mode).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: Request body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Incorrect password or PIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found, unpublished, expired, or not a client gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many attempts; try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/visitor:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    post:
      tags:
        - Client Gallery
      operationId: createOrRecognizeVisitor
      summary: Create or recognize the visitor for a gallery
      description: >-
        This route is one of the ones that actually establishes the per-gallery visitor session
        cookie. If an existing visitor session already matches this gallery, it's returned as-is.
        Otherwise a new visitor row is created (unless both name and email are blank and the
        gallery's `clientInfoMode` isn't `required`, in which case the session token is saved
        without a DB row yet — a "deferred anonymous" visitor, lazily persisted by other routes such
        as selections/comments). When `clientInfoMode` is `required`, both a name and a valid email
        are mandatory. Rate-limited to 30 requests/10 minutes per IP via `writeAllowed`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                email:
                  type: string
                  maxLength: 320
      responses:
        '200':
          description: An existing visitor session for this gallery was recognized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  visitorId:
                    type: string
                required:
                  - ok
                  - visitorId
        '201':
          description: A new visitor was created, or an anonymous session was deferred.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  visitorId:
                    type: string
                    description: >-
                      Omitted when the visitor row creation was deferred (fully anonymous,
                      non-required info mode).
                required:
                  - ok
        '400':
          description: Name/email too long, or name/valid email missing when required by `clientInfoMode`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found or not viewable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/selections:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    get:
      tags:
        - Client Gallery
      operationId: getSelections
      summary: List the visitor's selected photos and selection lists
      description: >-
        Returns the photo IDs currently selected by this visitor in the active list (the default
        unnamed list unless `listId` is given and resolves to a list the visitor owns), plus all of
        the visitor's named lists and the gallery's selection limit, if any
        (`gallery.limitSelections` + `gallery.selectionLimit`).
      security:
        - visitorCookieAuth: []
      parameters:
        - name: listId
          in: query
          required: false
          description: >-
            A named selection list ID owned by this visitor. Falls back to the default (unnamed)
            list if omitted or not owned by this visitor.
          schema:
            type: string
      responses:
        '200':
          description: Current selections and lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoIds:
                    type: array
                    items:
                      type: string
                  selectionLimit:
                    type:
                      - integer
                      - 'null'
                  selectionCount:
                    type: integer
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/SelectionList'
                  activeListId:
                    type:
                      - string
                      - 'null'
                required:
                  - photoIds
                  - selectionLimit
                  - selectionCount
                  - lists
                  - activeListId
        '401':
          description: No visitor session cookie present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found or not viewable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Client Gallery
      operationId: addSelection
      summary: Add a photo to the visitor's selections
      description: >-
        Adds `photoId` to the visitor's active selection list (the default list, or a named list
        they own if `listId` is given). Enforces `gallery.selectionLimit` when
        `gallery.limitSelections` is set (counting the current list only). Idempotent — re-adding an
        already-selected photo is a no-op (`onConflictDoNothing`). The photo must exist in this
        gallery and be `ready`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: string
                listId:
                  type: string
                  description: A named selection list ID owned by this visitor; omit for the default list.
              required:
                - photoId
      responses:
        '200':
          description: Selected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: photoId missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No visitor session cookie present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable, or photo not found/not in this gallery/not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Selection limit reached for the active list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Client Gallery
      operationId: removeSelection
      summary: Remove a photo from the visitor's selections
      description: >-
        Removes `photoId` from the visitor's active selection list (default list, or the named list
        given by `listId`). Always returns success even if the photo wasn't selected.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: string
                listId:
                  type: string
                  description: A named selection list ID owned by this visitor; omit for the default list.
              required:
                - photoId
      responses:
        '200':
          description: Removed (or was never selected).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: photoId missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No visitor session cookie present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found or not viewable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Client Gallery
      operationId: createSelectionList
      summary: Create a named selection list
      description: >-
        Creates a new named selection list for the visitor (max 5 per visitor per gallery,
        `MAX_LISTS_PER_VISITOR`). The reserved default-list name cannot be used. Rate-limited to 20
        requests/15 minutes per IP via `writeAllowed`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
              required:
                - name
      responses:
        '201':
          description: List created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionList'
        '400':
          description: Name missing/blank, or name is the reserved default-list name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No visitor session cookie present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found or not viewable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Visitor already has the maximum number of lists (5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/selections/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
      - name: listId
        in: path
        required: true
        description: The selection list's ID.
        schema:
          type: string
    delete:
      tags:
        - Client Gallery
      operationId: deleteSelectionList
      summary: Delete one of the visitor's named selection lists
      description: >-
        Deletes a named selection list owned by the current visitor. Its selections are removed too,
        via a DB foreign-key cascade. A visitor can never delete another visitor's list — ownership
        is checked by `visitorId` + `galleryId`.
      security:
        - visitorCookieAuth: []
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '401':
          description: No visitor session cookie present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable, or list not found/not owned by this visitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/comments:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    get:
      tags:
        - Client Gallery
      operationId: getPhotoComments
      summary: List comments on a photo
      description: >-
        Returns visible comments (plus the caller's own pending ones) for a photo, along with a
        prefilled commenter name. 404s if the gallery doesn't have comments enabled
        (`galleryCommentsEnabled`) in addition to the usual not-found/not-viewable cases.
      security:
        - visitorCookieAuth: []
      parameters:
        - name: photoId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comments for the photo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  prefilledName:
                    type: string
                required:
                  - comments
                  - prefilledName
        '400':
          description: photoId query param missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable/comments disabled, or photo not found/not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Client Gallery
      operationId: createComment
      summary: Post a comment on a photo
      description: >-
        Creates a comment as the visitor identity resolved from the gallery-visitor session cookie.
        If the gallery moderates comments (`commentsMode: 'pre'`) the comment is created with
        `status: pending` and only visible to its author until approved; otherwise it's immediately
        `visible`. A deferred anonymous visitor (session token but no DB row yet) is lazily
        persisted here, same as in the selections route, provided a name is supplied. Rate-limited
        to 20 requests/10 minutes per IP via `writeAllowed`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: string
                body:
                  type: string
                  maxLength: 2000
                name:
                  type: string
                  maxLength: 80
                  description: >-
                    Required the first time a deferred/anonymous visitor comments; ignored once the
                    visitor already has a stored name.
              required:
                - photoId
                - body
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  comment:
                    $ref: '#/components/schemas/Comment'
                required:
                  - ok
                  - comment
        '400':
          description: photoId/body missing, body/name too long, or name required and missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No visitor session cookie present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable/comments disabled, or photo not found/not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Client Gallery
      operationId: deleteOwnComment
      summary: Hide (soft-delete) the caller's own comment
      description: >-
        Sets a comment's status to `hidden`. Only the comment's own author (matched by visitor
        identity) may delete it, and photographer-authored comments can never be deleted this way.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentId:
                  type: string
              required:
                - commentId
      responses:
        '200':
          description: Comment hidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: commentId missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            Caller has no resolvable comment identity, does not own the comment, or the comment is a
            photographer comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable/comments disabled, or comment not found in this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/magic-link:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    post:
      tags:
        - Client Gallery
      operationId: requestMagicLink
      summary: Email the visitor a magic sign-in link for this gallery
      description: >-
        Issues a single-use magic-link token for the given email and returns the link URL directly
        in the response (the app is expected to email it; this endpoint itself does not send mail).
        Rate-limited via `writeAllowed` to 5 requests/15 minutes per IP, and separately 5
        requests/15 minutes per normalized email address. Also links the email to the current
        visitor session, if any, and writes an admin audit log entry (`magic_link.issue`).
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        '200':
          description: Magic link issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expiresAt:
                    type: integer
                    description: Unix ms timestamp when the link expires.
                required:
                  - url
                  - expiresAt
        '400':
          description: Invalid JSON body, or missing/invalid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found, not viewable, or not a client gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests (per-IP or per-email limit).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/magic-link/verify:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    get:
      tags:
        - Client Gallery
      operationId: verifyMagicLink
      summary: Verify a magic-link token and link the visitor session to a client account
      description: >-
        Validates the `token` query param against the gallery, then links (or creates) the visitor
        session to the resolved client account, setting the gallery-visitor session cookie. This is
        one of the routes that establishes the visitor session cookie in the first place. Non-admins
        must already have passed the gallery's access gate (`needsAccessGate` + `hasGalleryAccess`)
        if the gallery requires one.
      security:
        - visitorCookieAuth: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verified and linked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: token query param missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Gallery requires its password/PIN gate and the caller hasn't passed it yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found, not viewable, or not a client gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/testimonial:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    post:
      tags:
        - Client Gallery
      operationId: submitTestimonial
      summary: Submit a testimonial for a delivered gallery
      description: >-
        Creates a `pending` testimonial (subject to admin approval). Only allowed once the gallery's
        `deliveryState` is `delivered`, and only once per visitor per gallery
        (`hasSubmittedTestimonial`). Rate-limited to 5 requests/hour per IP via `writeAllowed`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: number
                  description: Rounded server-side; must be between 1 and 5.
                quote:
                  type: string
                  maxLength: 2000
                authorName:
                  type: string
                  maxLength: 200
                  description: Falls back to the visitor's stored name if omitted.
              required:
                - rating
                - quote
      responses:
        '201':
          description: Testimonial submitted (pending approval).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: Invalid JSON, rating out of range, quote/name missing or too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No visitor session cookie present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable/not a client gallery, or not yet delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Visitor already submitted a testimonial for this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/featured-consent:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    post:
      tags:
        - Client Gallery
      operationId: setFeaturedConsent
      summary: Grant or decline consent to be featured
      description: >-
        Sets the gallery's `featuredConsent` field to `granted` or `declined`, recording whether the
        client consents to their gallery being used in the photographer's marketing/portfolio.
        Rate-limited to 10 requests/hour per IP via `writeAllowed`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                granted:
                  type: boolean
              required:
                - granted
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: Invalid JSON body, or `granted` is not a boolean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found, not viewable, or not a client gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/download-info:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    get:
      tags:
        - Client Gallery
      operationId: getDownloadInfo
      summary: Get download size/count info for a gallery
      description: >-
        Returns the count and total byte size of all `ready` photos in the gallery, for showing a
        "download all" size estimate before the client commits to it.
      security:
        - visitorCookieAuth: []
      responses:
        '200':
          description: Download info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  sizeBytes:
                    type: integer
                  sizeLabel:
                    type: string
                    description: Human-readable size, e.g. "1.2 GB".
                required:
                  - count
                  - sizeBytes
                  - sizeLabel
        '404':
          description: Gallery not found, not viewable, or not a client gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/bib-search:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    get:
      tags:
        - Client Gallery
      operationId: searchByBibNumber
      summary: Find photos by race-bib number
      description: >-
        Looks up `ready` photos tagged with the given bib number. Only available when the gallery
        has `gallery.bibSearch` enabled. Rate-limited to 60 requests/minute per IP+gallery via
        `writeAllowed`. Response deliberately avoids asserting identity — copy is phrased as "photos
        matching #N", not a claim the bib belongs to any particular person.
      security:
        - visitorCookieAuth: []
      parameters:
        - name: number
          in: query
          required: true
          description: 1-6 digit bib number. Leading zeros are stripped server-side.
          schema:
            type: string
            pattern: ^\d{1,6}$
      responses:
        '200':
          description: Matching photo IDs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    type: string
                    description: The normalized (leading-zero-stripped) bib number searched.
                  photoIds:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
                  label:
                    type: string
                required:
                  - number
                  - photoIds
                  - count
        '400':
          description: number query param missing or not 1-6 digits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable/not a client gallery, or bib search not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/face-search:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    post:
      tags:
        - Client Gallery
      operationId: searchByFace
      summary: Find photos matching a selfie via face recognition
      description: >-
        Accepts a multipart form with a `selfie` file field (max 5 MB), detects faces in-memory, and
        matches against the gallery's stored face embeddings. The uploaded selfie is never written
        to disk or persisted — only match results (photo IDs) are returned. Only available when the
        gallery has `gallery.faceSearch` enabled. Hard rate-limited to 3 requests/15 minutes per
        IP+gallery via `writeAllowed`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                selfie:
                  type: string
                  format: binary
              required:
                - selfie
      responses:
        '200':
          description: Match results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoIds:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
                  facesDetected:
                    type: integer
                  selfieStored:
                    type: boolean
                    description: Always false — the selfie is never persisted.
                required:
                  - photoIds
                  - count
        '400':
          description: >-
            Invalid/missing form data, missing selfie file, selfie too large/empty, or face
            detection failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable/not a client gallery, or face search not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many selfie searches; try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/live-photos:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    get:
      tags:
        - Client Gallery
      operationId: getLivePhotos
      summary: Poll for newly published photos in a live gallery
      description: >-
        Returns `ready` photos created after the `since` timestamp, for live/event galleries to poll
        incrementally. Only available when the gallery has `gallery.autoPublishOnUpload` enabled;
        otherwise treated as not found.
      security:
        - visitorCookieAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: Unix ms timestamp; only photos created after this are returned. Defaults to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: New photos since the given timestamp.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      $ref: '#/components/schemas/GalleryPhoto'
                  serverTime:
                    type: integer
                    description: Unix ms server time, for the caller to use as the next poll's `since`.
                  live:
                    type: boolean
                required:
                  - photos
                  - serverTime
                  - live
        '400':
          description: since query param is not a valid non-negative number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Gallery not found, not viewable, not a client gallery, or not a live/auto-publish
            gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/photo-view:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    post:
      tags:
        - Client Gallery
      operationId: recordPhotoView
      summary: Record a photo view
      description: >-
        Records an anonymous view event for a photo, used for the admin photo-view analytics.
        Rate-limited to 60 requests/minute per IP+gallery via `writeAllowed`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: string
              required:
                - photoId
      responses:
        '200':
          description: View recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: Invalid JSON body, or photoId missing/not a string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found/not viewable/not a client gallery, or photo not found in this gallery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/g/{slug}/find/save:
    parameters:
      - $ref: '#/components/parameters/GallerySlug'
    post:
      tags:
        - Client Gallery
      operationId: saveFoundPhotos
      summary: Save bib/face/event "find" results into the visitor's selections
      description: >-
        Bulk-adds up to 200 matched photo IDs to the visitor's selections (default list, or a named
        list via `listId`), typically called right after a bib-search/face-search/event-page result
        set. Only available when the gallery has `gallery.bibSearch`, `gallery.faceSearch`, or
        `gallery.eventPage` enabled. Lazily creates a deferred anonymous visitor if none exists yet.
        Duplicate/invalid IDs are silently skipped (`onConflictDoNothing`). Rate-limited to 20
        requests/15 minutes per IP+gallery via `writeAllowed`.
      security:
        - visitorCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoIds:
                  type: array
                  items:
                    type: string
                  maxItems: 200
                listId:
                  type:
                    - string
                    - 'null'
                  description: >-
                    A named selection list ID owned by this visitor, or null/omitted for the default
                    list.
              required:
                - photoIds
      responses:
        '200':
          description: Save result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: integer
                    description: Number of photos newly inserted (duplicates already selected don't count).
                  count:
                    type: integer
                    description: >-
                      Number of the given photoIds that resolved to valid, ready photos in this
                      gallery.
                required:
                  - saved
                  - count
        '400':
          description: Invalid JSON body, or photoIds missing/empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No visitor session cookie present and none could be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Gallery not found/not viewable/not a client gallery, or none of
            bib-search/face-search/event-page enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/settings:
    get:
      tags:
        - Settings
      summary: Get site settings
      description: >-
        Returns all site content/config settings (about/contact copy, home hero text, SMTP config
        with the password redacted, gallery defaults, and whether a watermark is currently set).
      operationId: getSettings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Settings
      summary: Update site settings or upload a watermark
      description: >-
        Two request shapes on the same route. Send `multipart/form-data` with a `watermark` field to
        upload a new watermark PNG (max 10 MB, must decode as PNG). Send `application/json` to
        update any subset of text/SMTP settings and gallery defaults — every field is optional and
        only recognized keys of the correct type are applied; unrecognized or wrong-typed fields are
        silently ignored. String fields are trimmed and length-capped (200 chars for short fields,
        2000 for long-form content) server-side. `smtpPassClear: true` clears the stored SMTP
        password; otherwise a non-empty `smtpPass` string overwrites it and an absent one leaves it
        untouched.
      operationId: updateSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                watermark:
                  type: string
                  format: binary
                  description: PNG image, max 10 MB.
              required:
                - watermark
          application/json:
            schema:
              $ref: '#/components/schemas/SiteSettingsUpdate'
      responses:
        '200':
          description: Settings updated, or watermark uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '400':
          description: Missing watermark file in the multipart form, or the JSON body could not be parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Watermark file larger than 10 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Uploaded watermark is not a valid PNG.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Settings
      summary: Remove the site watermark
      description: Deletes the stored watermark PNG, if any (no-op if none is set).
      operationId: deleteWatermark
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Watermark removed (or already absent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/settings/watermark:
    get:
      tags:
        - Settings
      summary: Fetch the current watermark image
      description: >-
        Streams the raw watermark PNG for preview in the admin settings page. Supports HTTP range
        requests via the shared file-streaming helper.
      operationId: getWatermarkImage
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Watermark image bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No watermark is currently set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/settings/smtp-test:
    post:
      tags:
        - Settings
      summary: Send a test email via the configured SMTP settings
      description: >-
        Sends a fixed "Albm SMTP test" message to the configured notify recipient (or contact email
        fallback) using the currently saved SMTP settings. Requires SMTP to already be configured.
      operationId: sendSmtpTest
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Test email sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  to:
                    type: string
                    description: Recipient address the test was sent to.
        '400':
          description: >-
            SMTP is not configured yet, or no recipient could be determined (no "Notify to" or
            contact email set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Send failed — check host/port/credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/security:
    get:
      tags:
        - Settings
      summary: Get security/login settings
      description: >-
        Returns registered passkeys (metadata only, no credential material), whether password login
        is enabled, how many unused recovery codes remain, and whether password login can currently
        be disabled (it cannot be disabled if doing so would leave no other way to log in).
      operationId: getSecuritySettings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current security settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritySettings'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Settings
      summary: Enable or disable password login
      description: >-
        Toggles password-based admin login. Disabling is rejected with `400` when it would remove
        the only remaining way to log in (e.g. no passkeys registered) — the reason is included in
        the error message.
      operationId: setPasswordLoginEnabled
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passwordLoginEnabled:
                  type: boolean
              required:
                - passwordLoginEnabled
      responses:
        '200':
          description: Password login setting updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  passwordLoginEnabled:
                    type: boolean
        '400':
          description: >-
            Invalid request body (missing/non-boolean `passwordLoginEnabled`), or disabling would
            leave no other login method available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/upload-tokens:
    get:
      tags:
        - Upload Tokens
      summary: List upload tokens
      description: >-
        Returns all upload tokens (including revoked ones) with metadata only — raw token values are
        never returned after creation, only a one-way hash is stored server-side.
      operationId: listUploadTokens
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Upload tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/UploadToken'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Upload Tokens
      summary: Create an upload token
      description: >-
        Creates a new token for use with the external publish API. The raw token value is returned
        exactly once in this response — it cannot be retrieved again afterward, only revoked and
        replaced.
      operationId: createUploadToken
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Human-readable label (trimmed; required, non-empty).
              required:
                - name
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  createdAt:
                    type: integer
                    description: Epoch milliseconds.
                  token:
                    type: string
                    description: Raw bearer token value — shown only this once.
        '400':
          description: Invalid request body, or `name` missing/empty after trimming.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Upload Tokens
      summary: Revoke an upload token
      description: >-
        Revokes (soft-deletes) an upload token by id. A revoked token can no longer authenticate
        publish-API requests.
      operationId: revokeUploadToken
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
      responses:
        '200':
          description: Token revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '400':
          description: Invalid request body, or `id` missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/storage:
    get:
      tags:
        - Storage & Maintenance
      summary: Get storage usage snapshot
      description: >-
        Returns disk usage, total data-directory size, and per-gallery photo/size/RAW breakdown.
        Cached for 1 hour; pass `?refresh=1` to force recomputation.
      operationId: getStorageSnapshot
      security:
        - cookieAuth: []
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: string
            enum:
              - '1'
          description: Pass `1` to bypass the 1-hour cache and recompute now.
      responses:
        '200':
          description: Storage snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSnapshot'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/maintenance/scan:
    get:
      tags:
        - Storage & Maintenance
      summary: Scan derivative integrity and storage usage
      description: >-
        Scans every `ready` photo in every gallery for missing derivative files (thumb/md/web, plus
        workingJpeg/print for RAW originals) and reports per-gallery storage usage alongside soft
        quota state. Not cached — recomputed on every call.
      operationId: scanMaintenanceIntegrity
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Integrity report and storage usage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrity:
                    $ref: '#/components/schemas/IntegritySummary'
                  storage:
                    $ref: '#/components/schemas/AllGalleriesStorageUsage'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/maintenance/regenerate:
    post:
      tags:
        - Storage & Maintenance
      summary: Regenerate missing derivatives
      description: >-
        Regenerates missing derivative files for a single photo (`photoId`) or every photo with a
        gap in a gallery (`galleryId`). Exactly one of the two fields should be supplied; `photoId`
        takes precedence if both are present. `thumb`/`md`/`web` regeneration is enqueued on the
        background derivative queue (fire-and-forget); `workingJpeg` and `print` are regenerated
        synchronously and their success/failure is reflected in the response.
      operationId: regenerateDerivatives
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: string
                galleryId:
                  type: string
              description: Provide exactly one of `photoId` or `galleryId`.
      responses:
        '200':
          description: Regeneration result for the photo or gallery.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RegenerateResult'
                  - $ref: '#/components/schemas/RegenerateGalleryResult'
        '400':
          description: Body did not parse as JSON, or neither `photoId` nor `galleryId` was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/audit:
    get:
      tags:
        - Audit & Sessions
      summary: List (or export) the admin audit log
      description: >-
        Returns audit-log entries, most recent first (max 500, default 200), optionally filtered by
        action type, actor type, and a rolling window in days. Pass `?format=csv` to instead
        download the filtered rows as a CSV attachment.
      operationId: listAuditLog
      security:
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Filter to a single audit action type (e.g. `settings.update`).
        - name: actor
          in: query
          required: false
          schema:
            type: string
            enum:
              - owner
              - collaborator
          description: Filter by actor type. Any other value is ignored.
        - name: days
          in: query
          required: false
          schema:
            type: integer
          description: Only include entries from the last N days.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - csv
          description: Pass `csv` to receive a CSV file instead of JSON.
      responses:
        '200':
          description: Audit log rows (JSON) or a CSV file (`format=csv`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  actions:
                    type: array
                    items:
                      type: string
                    description: All distinct action types seen in the log, for filter UIs.
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/sessions:
    get:
      tags:
        - Audit & Sessions
      summary: List active admin sessions
      description: >-
        Returns every currently active admin session (owner and collaborator), each flagged with
        `isCurrent` for the session making this request.
      operationId: listAdminSessions
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSession'
                  currentId:
                    type:
                      - string
                      - 'null'
        '401':
          description: Not logged in as admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Audit & Sessions
      summary: Revoke an admin session (or all others)
      description: >-
        Two request shapes: `{ "revokeAllOthers": true }` revokes every admin session except the
        caller's own and returns the count revoked; `{ "id": "<sessionId>" }` revokes a single named
        session. Revoking the caller's own current session is rejected — use the logout flow
        instead.
      operationId: revokeAdminSession
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revokeAllOthers:
                  type: boolean
                id:
                  type: string
              description: 'Provide either `revokeAllOthers: true` or an `id`.'
      responses:
        '200':
          description: Session(s) revoked.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ok:
                        type: boolean
                        const: true
                      revoked:
                        type: integer
                        description: Count of other sessions revoked (revokeAllOthers path).
                  - type: object
                    properties:
                      ok:
                        type: boolean
                        const: true
        '400':
          description: >-
            Invalid JSON body, `id` missing when not using `revokeAllOthers`, or attempting to
            revoke the caller's own current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in as admin, or no resolvable current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No session with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/publish/galleries:
    get:
      tags:
        - Publish
      summary: List galleries a publish token may publish to
      description: >-
        Returns every gallery in the instance. Upload tokens are global, not gallery-scoped, so this
        is the same set of galleries the upload endpoint already accepts for this token. Used by the
        Lightroom Publish Service plugin's gallery picker. Rate-limited to 120 requests / 15 min per
        token+IP.
      operationId: listGalleriesForToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Galleries available to this token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  galleries:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishGallery'
        '401':
          description: Missing, invalid, or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (120 requests / 15 min per token+IP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/publish/{galleryId}/photos:
    post:
      tags:
        - Publish
      summary: Upload a photo to a gallery
      description: >-
        Pushes a new photo into an existing gallery. Accepts JPEG or PNG; filenames are sanitized
        and deduplicated by content hash — a repeat upload of the same content returns `200` with
        `duplicate: true` instead of creating a new photo. Optionally assigns the photo to an
        existing gallery section via the `sectionId` form field. Rate-limited to 300 uploads / 15
        min per token+IP.
      operationId: uploadPublishPhoto
      security:
        - bearerAuth: []
      parameters:
        - name: galleryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG or PNG image, max 50 MB.
                sectionId:
                  type: string
                  description: Optional existing section id to assign the photo to.
              required:
                - file
      responses:
        '200':
          description: Duplicate content hash — no new photo was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishDuplicate'
        '201':
          description: 'Photo accepted; processing started (`status: processing` → `ready`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishPhoto'
        '400':
          description: Request was not multipart form data, or the `file` field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File over 50 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Not JPEG/PNG, or unreadable image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (300 uploads / 15 min per token+IP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/publish/{galleryId}/photos/{photoId}:
    put:
      tags:
        - Publish
      summary: Replace a photo's content (edited re-publish)
      description: >-
        Replaces an existing photo's content in place — the old file and derivatives are deleted and
        the new content is ingested fresh, which means the response's `id` is a **new photo id**;
        callers must update their stored reference to it. Audit-logged as `publish.replace`.
        Rate-limited to 300 requests / 15 min per token+IP.
      operationId: replacePublishPhoto
      security:
        - bearerAuth: []
      parameters:
        - name: galleryId
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG or PNG image, max 50 MB.
              required:
                - file
      responses:
        '200':
          description: >-
            Photo replaced (new photo id in the response), or a duplicate content hash was detected
            (`duplicate: true`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PublishPhoto'
                  - $ref: '#/components/schemas/PublishDuplicate'
        '400':
          description: Request was not multipart form data, or the `file` field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Photo does not exist in this gallery — upload it fresh instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (300 requests / 15 min per token+IP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Publish
      summary: Delete a photo
      description: >-
        Deletes a photo and its files. Audit-logged as `publish.delete`. Rate-limited to 300
        requests / 15 min per token+IP.
      operationId: deletePublishPhoto
      security:
        - bearerAuth: []
      parameters:
        - name: galleryId
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Photo deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '401':
          description: Missing, invalid, or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Photo already gone (or never belonged to this gallery).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (300 requests / 15 min per token+IP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/health:
    get:
      tags:
        - System
      summary: Health probe
      description: >-
        Unauthenticated liveness/readiness check for uptime monitors. Runs a trivial `SELECT 1`
        against the database; leaks nothing beyond ok/fail.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Database reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '500':
          description: Database query failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
  /api/admin/version:
    get:
      tags:
        - System
      summary: Get app version and update availability
      description: >-
        Returns the running app version and, unless `DISABLE_UPDATE_CHECK=1`, the latest GitHub
        release tag (cached 24h) with an `updateAvailable` flag. Despite living alongside the
        unauthenticated System routes, this endpoint is **admin-gated** — it requires a valid admin
        session like any other `/api/admin/*` route.
